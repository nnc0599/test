name: Build app_b Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - app_b/**
      - .github/workflows/build-app-b-windows.yml

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app_b/requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean app_b/app_b.spec

      - name: Prepare portable bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/app_b.exe release/app_b.exe
          Copy-Item app_b/README.md release/README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app_b-windows-exe
          path: release/*